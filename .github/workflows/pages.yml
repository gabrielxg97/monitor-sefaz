name: Monitor SEFAZ - atualizar dados e publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Montar site
        run: |
          mkdir -p _site/data
          cp index2.html _site/index.html
          cp sefaz.js sefaz.css _site/

      - name: Baixar status da SEFAZ (IntegraNotas)
        run: |
          for m in nfe nfce cte mdfe gnre nfcom dce; do
            curl -fsS --retry 3 --max-time 30 \
              "https://integranotas.com.br/api/sefaz/$m" -o "_site/data/$m.json" \
              || echo "Falha ao baixar $m"
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
